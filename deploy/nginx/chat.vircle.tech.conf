# nginx site for the Vircle Chat gateway (docs/vircle-chat-gateway-deploy.md, step 4).
# Install:  cp deploy/nginx/chat.vircle.tech.conf /etc/nginx/sites-available/chat.vircle.tech
#           ln -sf /etc/nginx/sites-available/chat.vircle.tech /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx && certbot --nginx -d chat.vircle.tech --redirect
# certbot adds the certificate and the https listener to this file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Flood protection per client address. Generous on purpose: many phones share one address behind a mobile carrier's NAT,
# and the gateway has its own per-user limits. These only stop one address hammering the server.
limit_req_zone $binary_remote_addr zone=gateway_http:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=gateway_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.vircle.tech;

    # Files are uploaded to the gateway over HTTPS (work package 4); the gateway enforces its own 16 MB limit.
    client_max_body_size 20m;

    limit_conn gateway_conn 300;
    limit_req_status 429;
    limit_conn_status 429;

    # Monitoring numbers are for this machine only (a scraper on the server, or `curl` over SSH). The token is a second lock.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # The socket: one long-lived request per phone, so no request-rate limit here (the connection limit above applies).
    location = /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A WebSocket stays open for as long as the app does; the gateway pings every 25 seconds.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=gateway_http burst=100 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
