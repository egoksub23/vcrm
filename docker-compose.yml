name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    # Container logs rotate: the default keeps them for ever, and a busy server fills its disk with them (the chat gateway's compose file does the same).
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    # Filesystem storage: host directory → /app/storage inside the container.
    # Create /opt/halo-storage on the VPS before first deploy.
    volumes:
      - /opt/halo-storage:/app/storage
    # The second network reaches the Secure Sign converter below. It has no way out to the internet.
    networks:
      - default
      - sign-internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Secure Sign: turns an uploaded Word file into a PDF (LibreOffice inside Gotenberg). It is only started
  # when the `sign` profile is on: add COMPOSE_PROFILES=sign and SIGN_CONVERTER_URL=http://sign-converter:3000
  # to .env.local. See docs/docker.md ("Secure Sign converter"). Uploaded Word files are untrusted, so the
  # container is locked down: no internet, no published port, read-only except a temporary folder, no
  # capabilities, limited memory and processes.
  sign-converter:
    profiles: ['sign']
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - sign-internal
    command:
      - gotenberg
      - --api-port=3000
      - --api-timeout=60s
      - --api-disable-health-check-logging=true
      # Only the Word route is wanted: no web page rendering, no other converters.
      - --chromium-disable-routes=true
      - --libreoffice-restart-after=50
      - --libreoffice-start-timeout=30s
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
      - /home/gotenberg:size=256m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    # 1 is the most a one-CPU server accepts; Docker refuses to start the container above the host's CPU count.
    cpus: 1
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # MinIO: S3-compatible object storage, replaces Supabase Storage.
  # Enable with COMPOSE_PROFILES=minio and set STORAGE_PROVIDER=minio in .env.local.
  # Buckets to create on first run (via mc or the MinIO console at :9001):
  #   chat-media, avatars, post-media, compliance-files, share, sign-documents, kb, private-media
  # One-time data migration from Supabase: mc mirror supabase/<bucket> minio/<bucket>
  minio:
    profiles: ['minio']
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # MinIO console
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL: self-hosted database, replaces Supabase.
  # Data is persisted in the pg_data volume.
  # Schema migrations run automatically on app start (next-pg-migrate).
  # One-time data migration from Supabase: see scripts/migrate-pg.cjs
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-wacrm}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-wacrm}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-wacrm} -d ${PG_DB:-wacrm}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio_data:
  pg_data:

networks:
  # No route out of this network: the converter can be reached by the app and cannot reach anything.
  sign-internal:
    internal: true
